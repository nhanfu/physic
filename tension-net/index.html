<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tension Net 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #hud {
    position: fixed; top: 14px; left: 16px;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #8b95a5; user-select: none;
  }
  #hud b { color: #d7dee8; font-weight: 600; }
  #hud input {
    font: inherit; width: 52px; color: #d7dee8; background: #12161b;
    border: 1px solid #2c343f; border-radius: 4px; padding: 0 4px;
  }
  #hud button {
    font: inherit; color: #d7dee8; background: #1a1f26;
    border: 1px solid #2c343f; border-radius: 4px; padding: 0 8px; cursor: pointer;
  }
  #row { margin-top: 6px; }
  #info { color: #ffd79f; margin-top: 6px; }
  #hint { color: #8b95a5; margin-top: 4px; max-width: 560px; white-space: normal; }
  #tourlist {
    position: fixed; top: 14px; right: 14px; width: 330px; max-height: 80vh; overflow: auto;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #c3ccd8;
    background: rgba(11,13,16,0.85); border: 1px solid #2c343f; border-radius: 6px; padding: 8px 10px;
  }
  #tourlist:empty { display: none; }
  #tourlist .head { color: #ffd79f; margin-bottom: 6px; }
  #tourlist .seg { padding: 4px 6px; border-radius: 4px; cursor: default; }
  #tourlist .seg:hover { background: #1f2630; color: #ffffff; }
  #tourlist .nodes { color: #8b95a5; word-break: break-word; }
  #tourlist .done { margin-top: 8px; padding-top: 6px; border-top: 1px solid #2c343f; color: #9be38a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><b>lưới</b> cột <input id="cols" type="number" min="2" max="30" value="12">
    hàng <input id="rows" type="number" min="2" max="30" value="7">
    sợi <input id="m" type="number" min="1" max="600" value="160">
    ghim <input id="p" type="number" min="2" max="64" value="8">
    <button id="gen">Tạo lưới</button>
    <button id="view">Đặt lại góc nhìn</button>
    <button id="tour">Chu trình</button></div>
  <div id="info"></div>
  <div id="tourlist"></div>
<div id="hint">Trần là mặt phẳng y = 0 chứa các ghim (màu cam). Trọng lực kéo phần còn lại xuống.
    Kéo nền để xoay, cuộn để zoom, click node để ghim/bỏ ghim, kéo node để đổi vị trí ghim trên mặt phẳng của nó.
    Node ở nửa dưới sau khi cân bằng được làm mờ; sợi càng căng càng đỏ.</div>
</div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tension Net</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #hud {
    position: fixed; top: 14px; left: 16px;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #8b95a5; user-select: none;
  }
  #hud b { color: #d7dee8; font-weight: 600; }
  #hud input {
    font: inherit; width: 56px; color: #d7dee8; background: #12161b;
    border: 1px solid #2c343f; border-radius: 4px; padding: 0 4px;
  }
  #hud button {
    font: inherit; color: #d7dee8; background: #1a1f26;
    border: 1px solid #2c343f; border-radius: 4px; padding: 0 8px; cursor: pointer;
  }
  #row { margin-top: 6px; }
  #info { color: #ffd79f; margin-top: 6px; }
  #hint { color: #8b95a5; margin-top: 4px; max-width: 520px; white-space: normal; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><b>lưới</b> node <input id="n" type="number" min="2" max="200" value="40">
    sợi <input id="m" type="number" min="1" max="400" value="52">
    ghim <input id="p" type="number" min="2" max="200" value="4">
    <button id="gen">Tạo lưới</button></div>
  <div id="row"><button id="pull">Kéo giãn ghim ×1.2</button>
    <button id="view">Về khung mặc định</button></div>
  <div id="info"></div>
  <div id="hint">Kéo nút để đặt ghim tại vị trí mới. Click nút để ghim/bỏ ghim. Kéo nền để di chuyển, cuộn chuột để zoom.</div>
</div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>

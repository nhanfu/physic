<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Triple Pendulum</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
  canvas { display: block; touch-action: none; }
  #hud {
    position: fixed; top: 14px; left: 16px;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #8b95a5; user-select: none; pointer-events: none;
  }
  #hud b { color: #d7dee8; font-weight: 600; }
  #links-row { margin-top: 6px; pointer-events: auto; }
  #links-row button {
    font: inherit; color: #d7dee8; background: #1a1f26;
    border: 1px solid #2c343f; border-radius: 4px;
    padding: 0 8px; cursor: pointer;
  }
  #links-row button:disabled { opacity: 0.4; cursor: default; }
  #net-row { margin-top: 6px; pointer-events: auto; }
  #net-row input {
    font: inherit; width: 56px; color: #d7dee8; background: #12161b;
    border: 1px solid #2c343f; border-radius: 4px; padding: 0 4px;
  }
  #net-row button {
    font: inherit; color: #d7dee8; background: #1a1f26;
    border: 1px solid #2c343f; border-radius: 4px;
    padding: 0 8px; cursor: pointer;
  }
  #link-row { margin-top: 6px; pointer-events: auto; }
  #link-row button {
    font: inherit; color: #d7dee8; background: #1a1f26;
    border: 1px solid #2c343f; border-radius: 4px;
    padding: 0 8px; cursor: pointer;
  }
  #link-row button.on { border-color: #5ac8ff; color: #5ac8ff; }
  #link-hint { max-width: 420px; color: #ffd79f; white-space: normal; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <b>R</b> reset &nbsp;·&nbsp; trạng thái luôn là cân bằng tĩnh dưới trọng lực<br>
  <span id="energy"></span>
  <div id="links-row">
    <b>node</b> &nbsp;
    <button id="less">−</button>
    <span id="links-val">3</span>
    <button id="more">+</button>
    &nbsp;(hoặc phím + / −)
  </div>
  <div id="net-row">
    <b>lưới</b> &nbsp;
    node <input type="number" id="net-n" min="2" max="200" value="20">
    cạnh <input type="number" id="net-e" min="19" max="200" value="26">
    ghim <input type="number" id="net-p" min="0" max="200" value="2">
    <button id="net">Tạo lưới</button>
    <button id="relax">Cân bằng</button>
    <button id="arrange">Xếp ghim thành hàng</button>
  </div>
  <div id="path-info" style="color:#ffd79f;margin-top:4px"></div>
  <div id="link-row">
    <button id="linkmode">Chế độ nối</button>
    <button id="pinmode">Chế độ ghim</button>
    <button id="clearpins">Bỏ ghim hết</button>
  </div>
  <div id="link-hint"></div>
</div>
<script src="app.js"></script>
</body>
</html>
